<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercury's AI-Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #090a0f;
      color: #f4f4f5;
      font-family: Georgia, "Times New Roman", serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 14px;
    }

    .card {
      width: 100%;
      max-width: 620px;
      background: #15151d;
      border: 1px solid #30303b;
      border-radius: 30px;
      padding: 38px;
      box-shadow: 0 20px 70px rgba(0,0,0,.45);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(34px, 8vw, 58px);
      line-height: 1.05;
    }

    .subtitle {
      text-align: center;
      color: #a6a6b3;
      font-size: 20px;
      margin: 22px 0 35px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #383844;
      background: #0e0e14;
      color: white;
      border-radius: 18px;
      padding: 18px;
      outline: none;
      margin-bottom: 14px;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #7060ff;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 17px;
      margin-top: 8px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      background: #6857f5;
      transition: .15s;
    }

    button:hover {
      filter: brightness(1.1);
    }

    button:active {
      transform: scale(.98);
    }

    .secondary {
      background: #292934;
    }

    .message {
      min-height: 50px;
      margin-top: 22px;
      padding: 14px;
      border-radius: 15px;
      background: #0d0d13;
      color: #aaaab6;
      text-align: center;
    }

    .success {
      color: #86efac;
    }

    .error {
      color: #ff7777;
    }

    .hidden {
      display: none !important;
    }

    .topbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 25px;
    }

    .topbar button {
      width: auto;
      margin: 0;
      padding: 10px 15px;
    }

    .topbar .logout {
      margin-left: auto;
    }

    .code-box {
      position: relative;
      margin-top: 18px;
    }

    pre {
      max-height: 420px;
      overflow: auto;
      background: #09090d;
      border: 1px solid #30303a;
      border-radius: 16px;
      padding: 18px;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: monospace;
      font-size: 14px;
    }

    .copy {
      margin-top: 10px;
      background: #292934;
    }

    .small {
      color: #8d8d9a;
      font-size: 14px;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .page {
        padding: 12px;
        align-items: flex-start;
      }

      .card {
        margin-top: 25px;
        padding: 24px 18px;
        border-radius: 24px;
      }

      h1 {
        font-size: 38px;
      }

      .subtitle {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- LOGIN / REGISTER -->
  <section id="authCard" class="card">

    <h1>Mercury's AI-Generator</h1>

    <div class="subtitle">
      Crea tu cuenta o inicia sesión
    </div>

    <input
      id="email"
      type="email"
      autocomplete="email"
      placeholder="Tu correo electrónico"
    >

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="Tu contraseña"
    >

    <button id="registerBtn" type="button">
      Crear cuenta
    </button>

    <button id="loginBtn" type="button" class="secondary">
      Iniciar sesión
    </button>

    <div id="authMessage" class="message">
      Introduce tus datos.
    </div>

  </section>


  <!-- APP -->
  <section id="appCard" class="card hidden">

    <div class="topbar">
      <strong>Mercury AI</strong>

      <button
        id="logoutBtn"
        type="button"
        class="secondary logout"
      >
        Cerrar sesión
      </button>
    </div>

    <h2>Generador</h2>

    <p class="small">
      Describe el script que quieres crear.
    </p>

    <textarea
      id="prompt"
      placeholder="Ejemplo: crea una API REST en JavaScript..."
    ></textarea>

    <select id="language">
      <option value="javascript">JavaScript</option>
      <option value="python">Python</option>
      <option value="bash">Bash</option>
      <option value="c">C</option>
      <option value="cpp">C++</option>
      <option value="java">Java</option>
      <option value="go">Go</option>
      <option value="rust">Rust</option>
      <option value="php">PHP</option>
      <option value="ruby">Ruby</option>
      <option value="powershell">PowerShell</option>
      <option value="sql">SQL</option>
    </select>

    <button id="generateBtn" type="button">
      Generar código
    </button>

    <div id="generateMessage" class="message">
      Listo.
    </div>

    <div id="codeBox" class="code-box hidden">

      <pre id="codeOutput"></pre>

      <button
        id="copyBtn"
        type="button"
        class="copy"
      >
        📋 Copiar código
      </button>

    </div>

  </section>

</div>


<script>
  const API = window.location.origin;

  const authCard = document.getElementById("authCard");
  const appCard = document.getElementById("appCard");

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  const registerBtn = document.getElementById("registerBtn");
  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  const authMessage = document.getElementById("authMessage");

  const promptInput = document.getElementById("prompt");
  const languageInput = document.getElementById("language");
  const generateBtn = document.getElementById("generateBtn");

  const generateMessage =
    document.getElementById("generateMessage");

  const codeBox =
    document.getElementById("codeBox");

  const codeOutput =
    document.getElementById("codeOutput");

  const copyBtn =
    document.getElementById("copyBtn");


  // =========================================================
  // MENSAJES
  // =========================================================

  function showAuthMessage(text, type = "") {
    authMessage.textContent = text;
    authMessage.className = "message " + type;
  }

  function showGenerateMessage(text, type = "") {
    generateMessage.textContent = text;
    generateMessage.className = "message " + type;
  }


  // =========================================================
  // PETICIÓN API
  // =========================================================

  async function request(path, options = {}) {

    const response = await fetch(API + path, {
      ...options,
      headers: {
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    });

    let data;

    try {
      data = await response.json();
    } catch {
      data = {};
    }

    if (!response.ok) {
      throw new Error(
        data.error ||
        data.message ||
        "Error del servidor (" + response.status + ")"
      );
    }

    return data;
  }


  // =========================================================
  // REGISTRO
  // =========================================================

  registerBtn.addEventListener("click", async () => {

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      showAuthMessage(
        "❌ Introduce correo y contraseña.",
        "error"
      );
      return;
    }

    if (password.length < 6) {
      showAuthMessage(
        "❌ La contraseña debe tener al menos 6 caracteres.",
        "error"
      );
      return;
    }

    registerBtn.disabled = true;
    loginBtn.disabled = true;

    showAuthMessage("Creando cuenta...");

    try {

      const data = await request("/auth/register", {
        method: "POST",
        body: JSON.stringify({
          email,
          password
        })
      });

      if (data.token) {
        localStorage.setItem(
          "mercury_token",
          data.token
        );
      }

      showAuthMessage(
        "✅ Cuenta creada correctamente.",
        "success"
      );

      setTimeout(() => {
        showApp();
      }, 500);

    } catch (error) {

      showAuthMessage(
        "❌ " + error.message,
        "error"
      );

    } finally {
      registerBtn.disabled = false;
      loginBtn.disabled = false;
    }

  });


  // =========================================================
  // LOGIN
  // =========================================================

  loginBtn.addEventListener("click", async () => {

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      showAuthMessage(
        "❌ Introduce correo y contraseña.",
        "error"
      );
      return;
    }

    loginBtn.disabled = true;
    registerBtn.disabled = true;

    showAuthMessage("Iniciando sesión...");

    try {

      const data = await request("/auth/login", {
        method: "POST",
        body: JSON.stringify({
          email,
          password
        })
      });

      if (data.token) {
        localStorage.setItem(
          "mercury_token",
          data.token
        );
      }

      showAuthMessage(
        "✅ Sesión iniciada correctamente.",
        "success"
      );

      setTimeout(() => {
        showApp();
      }, 300);

    } catch (error) {

      showAuthMessage(
        "❌ " + error.message,
        "error"
      );

    } finally {
      loginBtn.disabled = false;
      registerBtn.disabled = false;
    }

  });


  // =========================================================
  // MOSTRAR APP
  // =========================================================

  function showApp() {

    authCard.classList.add("hidden");
    appCard.classList.remove("hidden");

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  // =========================================================
  // LOGOUT
  // =========================================================

  logoutBtn.addEventListener("click", () => {

    localStorage.removeItem("mercury_token");

    appCard.classList.add("hidden");
    authCard.classList.remove("hidden");

    emailInput.value = "";
    passwordInput.value = "";

    showAuthMessage("Sesión cerrada.");
  });


  // =========================================================
  // GENERAR
  // =========================================================

  generateBtn.addEventListener("click", async () => {

    const prompt = promptInput.value.trim();
    const language = languageInput.value;

    if (!prompt) {
      showGenerateMessage(
        "❌ Escribe lo que quieres generar.",
        "error"
      );
      return;
    }

    generateBtn.disabled = true;

    showGenerateMessage(
      "⚙️ Generando código..."
    );

    codeBox.classList.add("hidden");

    try {

      const token =
        localStorage.getItem("mercury_token");

      const data = await request("/generate", {
        method: "POST",

        headers: token
          ? {
              Authorization:
                "Bearer " + token
            }
          : {},

        body: JSON.stringify({
          prompt,
          language
        })
      });

      if (!data.code) {
        throw new Error(
          "El servidor no devolvió código."
        );
      }

      codeOutput.textContent = data.code;

      codeBox.classList.remove("hidden");

      showGenerateMessage(
        "✅ Código generado.",
        "success"
      );

      // Lleva directamente al resultado
      setTimeout(() => {
        codeBox.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }, 100);

    } catch (error) {

      showGenerateMessage(
        "❌ " + error.message,
        "error"
      );

    } finally {
      generateBtn.disabled = false;
    }

  });


  // =========================================================
  // COPIAR
  // =========================================================

  copyBtn.addEventListener("click", async () => {

    const code = codeOutput.textContent;

    if (!code) return;

    try {

      await navigator.clipboard.writeText(code);

      copyBtn.textContent = "✅ Copiado";

      setTimeout(() => {
        copyBtn.textContent = "📋 Copiar código";
      }, 1500);

    } catch {

      showGenerateMessage(
        "❌ No se pudo copiar el código.",
        "error"
      );

    }

  });


  // =========================================================
  // SESIÓN GUARDADA
  // =========================================================

  if (localStorage.getItem("mercury_token")) {
    showApp();
  }

</script>

</body>
</html>
