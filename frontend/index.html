<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Mercury AI</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:#08090d;
  color:#f5f5f7;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  overflow:hidden;
}

button,
textarea,
select,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.55;
}

/* =========================================================
   AUTH
========================================================= */

.authScreen{
  width:100%;
  height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(115,92,255,.18),
      transparent 45%
    ),
    #08090d;
}

.authScreen.show{
  display:flex;
}

.authCard{
  width:100%;
  max-width:430px;
  background:#111219;
  border:1px solid #292c36;
  border-radius:25px;
  padding:32px;
  box-shadow:0 25px 100px rgba(0,0,0,.45);
}

.authLogo{
  width:70px;
  height:70px;
  border-radius:21px;
  margin:0 auto 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:900;
  background:linear-gradient(135deg,#735cff,#a383ff);
  box-shadow:0 20px 70px rgba(115,92,255,.3);
}

.authTitle{
  text-align:center;
  font-size:30px;
  font-weight:900;
  margin:0;
}

.authSubtitle{
  text-align:center;
  color:#858894;
  margin:9px 0 28px;
  font-size:14px;
}

.authTabs{
  display:flex;
  background:#191b22;
  border-radius:13px;
  padding:4px;
  margin-bottom:22px;
}

.authTab{
  flex:1;
  border:0;
  border-radius:10px;
  padding:11px;
  background:transparent;
  color:#858894;
  font-weight:700;
}

.authTab.active{
  background:#292b35;
  color:white;
}

.authForm{
  display:none;
}

.authForm.active{
  display:block;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  color:#b7b8c1;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.field input{
  width:100%;
  border:1px solid #30323d;
  border-radius:13px;
  background:#191b22;
  color:white;
  padding:14px;
  outline:none;
}

.field input:focus{
  border-color:#735cff;
  box-shadow:0 0 0 3px rgba(115,92,255,.12);
}

.authButton{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  background:#735cff;
  color:white;
  font-weight:800;
  margin-top:5px;
}

.authError{
  min-height:22px;
  margin-top:13px;
  color:#ff7474;
  font-size:13px;
  text-align:center;
}

/* =========================================================
   APP
========================================================= */

.app{
  width:100%;
  height:100vh;
  display:none;
  overflow:hidden;
}

.app.show{
  display:flex;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  width:310px;
  min-width:310px;
  height:100%;
  background:#101116;
  border-right:1px solid #272933;
  display:flex;
  flex-direction:column;
  padding:18px;
  z-index:30;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:23px;
  font-weight:900;
  margin-bottom:20px;
}

.logoIcon{
  width:43px;
  height:43px;
  min-width:43px;
  border-radius:14px;
  background:linear-gradient(135deg,#735cff,#9a7cff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:900;
}

.newChat{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  background:#735cff;
  color:white;
  font-weight:800;
  font-size:15px;
  margin-bottom:20px;
  transition:.2s;
}

.newChat:hover{
  filter:brightness(1.1);
  transform:translateY(-1px);
}

.historyTitle{
  color:#777a86;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
  margin:5px 5px 10px;
}

.chatList{
  flex:1;
  min-height:0;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:5px;
  padding-right:2px;
}

.chatItem{
  border:0;
  background:transparent;
  color:#dddde5;
  width:100%;
  text-align:left;
  padding:12px 10px;
  border-radius:12px;
  display:flex;
  align-items:center;
  gap:9px;
  transition:.15s;
}

.chatItem:hover{
  background:#1c1e26;
}

.chatItem.active{
  background:#252431;
}

.chatIcon{
  font-size:16px;
  flex-shrink:0;
}

.chatTitle{
  flex:1;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:13px;
}

.deleteChat{
  opacity:0;
  border:0;
  background:transparent;
  color:#ff6b6b;
  padding:5px;
  border-radius:7px;
}

.chatItem:hover .deleteChat{
  opacity:1;
}

.deleteChat:hover{
  background:#302027;
}

.userBox{
  border-top:1px solid #292b34;
  padding-top:15px;
  margin-top:12px;
}

.userEmail{
  color:#c8c8d0;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-bottom:10px;
}

.userActions{
  display:flex;
  gap:7px;
}

.logout,
.adminButton{
  flex:1;
  border:0;
  border-radius:11px;
  padding:10px;
  background:#202129;
  color:#ddd;
  font-size:12px;
}

.adminButton{
  background:#28233b;
  color:#bdafff;
}

/* =========================================================
   MAIN
========================================================= */

.main{
  flex:1;
  height:100%;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(115,92,255,.12),
      transparent 40%
    ),
    #08090d;
}

/* =========================================================
   TOPBAR
========================================================= */

.topbar{
  height:72px;
  min-height:72px;
  border-bottom:1px solid #24262e;
  display:flex;
  align-items:center;
  padding:0 28px;
  gap:15px;
}

.menuButton{
  display:none;
  border:0;
  background:#1b1d24;
  color:white;
  border-radius:12px;
  width:44px;
  height:44px;
  font-size:21px;
}

.topTitle{
  font-size:18px;
  font-weight:900;
}

.topSub{
  color:#777a86;
  font-size:12px;
  margin-top:2px;
}

/* =========================================================
   CHAT AREA
========================================================= */

.chatArea{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:35px 25px;
}

.messages{
  width:100%;
  max-width:1050px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:25px;
}

.welcome{
  min-height:55vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:40px;
}

.welcomeLogo{
  width:88px;
  height:88px;
  border-radius:27px;
  background:linear-gradient(135deg,#735cff,#a383ff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
  font-weight:900;
  box-shadow:0 20px 70px rgba(115,92,255,.25);
  margin-bottom:25px;
}

.welcome h1{
  margin:0;
  font-size:42px;
  letter-spacing:-1.5px;
}

.welcome p{
  color:#858894;
  font-size:17px;
  margin-top:12px;
  max-width:550px;
}

/* =========================================================
   MESSAGE
========================================================= */

.message{
  display:flex;
  gap:14px;
  width:100%;
}

.avatar{
  width:41px;
  height:41px;
  min-width:41px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.message.user .avatar{
  background:#272a33;
}

.message.assistant .avatar{
  background:linear-gradient(135deg,#735cff,#9a7cff);
}

.messageContent{
  min-width:0;
  flex:1;
}

.messageName{
  font-size:12px;
  color:#8e919c;
  margin-bottom:7px;
  font-weight:800;
}

.messageText{
  color:#eeeef2;
  font-size:16px;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word;
}

.codeBlock{
  margin-top:5px;
  background:#0b0c10;
  border:1px solid #292c36;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 10px 35px rgba(0,0,0,.18);
}

.codeHeader{
  min-height:44px;
  padding:7px 10px 7px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  background:#15171d;
  color:#8f929e;
  font-size:12px;
}

.copyBtn{
  border:0;
  background:#242631;
  color:#ddd;
  border-radius:8px;
  padding:7px 11px;
  font-size:11px;
  font-weight:700;
}

.copyBtn:hover{
  background:#30333e;
}

.codeBlock pre{
  margin:0;
  padding:18px;
  overflow-x:auto;
  color:#e9e9ee;
  font-size:13px;
  line-height:1.65;
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}

/* =========================================================
   LOADING
========================================================= */

.loadingMessage{
  display:flex;
  align-items:center;
  gap:12px;
  color:#858894;
  font-size:14px;
}

.dots{
  display:flex;
  gap:4px;
}

.dots span{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#735cff;
  animation:pulse 1s infinite;
}

.dots span:nth-child(2){
  animation-delay:.15s;
}

.dots span:nth-child(3){
  animation-delay:.3s;
}

@keyframes pulse{
  0%,80%,100%{
    opacity:.25;
    transform:translateY(0);
  }
  40%{
    opacity:1;
    transform:translateY(-3px);
  }
}

/* =========================================================
   COMPOSER
========================================================= */

.composerWrap{
  padding:15px 25px 22px;
}

.composer{
  width:100%;
  max-width:1050px;
  margin:0 auto;
  background:#111219;
  border:1px solid #2a2c35;
  border-radius:22px;
  padding:14px;
  box-shadow:0 15px 60px rgba(0,0,0,.3);
}

.prompt{
  width:100%;
  min-height:90px;
  max-height:240px;
  resize:vertical;
  background:transparent;
  border:0;
  outline:0;
  color:white;
  padding:10px 12px;
  font-size:16px;
  line-height:1.5;
}

.prompt::placeholder{
  color:#666a75;
}

.controls{
  display:flex;
  gap:10px;
  align-items:center;
  margin-top:8px;
}

.language{
  flex:1;
  min-width:0;
  background:#1c1e26;
  border:1px solid #30323d;
  color:#eee;
  border-radius:12px;
  padding:11px 12px;
  outline:none;
}

.language:focus{
  border-color:#735cff;
}

.generate{
  border:0;
  background:#735cff;
  color:white;
  border-radius:12px;
  padding:12px 23px;
  font-weight:800;
  white-space:nowrap;
}

.generate:hover:not(:disabled){
  filter:brightness(1.08);
}

.status{
  max-width:1050px;
  margin:8px auto 0;
  color:#ff7474;
  font-size:13px;
  min-height:20px;
}

/* =========================================================
   MOBILE OVERLAY
========================================================= */

.overlay{
  display:none;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

  .sidebar{
    position:fixed;
    left:-320px;
    top:0;
    transition:.25s;
    box-shadow:20px 0 70px rgba(0,0,0,.5);
  }

  .sidebar.open{
    left:0;
  }

  .menuButton{
    display:block;
  }

  .topbar{
    height:62px;
    min-height:62px;
    padding:0 12px;
  }

  .topTitle{
    font-size:16px;
  }

  .topSub{
    display:none;
  }

  .chatArea{
    padding:20px 12px;
  }

  .messages{
    gap:20px;
  }

  .welcome{
    min-height:48vh;
    padding:20px;
  }

  .welcomeLogo{
    width:70px;
    height:70px;
    font-size:36px;
    border-radius:22px;
  }

  .welcome h1{
    font-size:30px;
  }

  .welcome p{
    font-size:14px;
  }

  .message{
    gap:9px;
  }

  .avatar{
    width:34px;
    height:34px;
    min-width:34px;
    border-radius:10px;
    font-size:12px;
  }

  .messageText{
    font-size:14px;
  }

  .codeBlock pre{
    font-size:12px;
    padding:14px;
  }

  .composerWrap{
    padding:8px 9px 10px;
  }

  .composer{
    border-radius:18px;
    padding:9px;
  }

  .prompt{
    min-height:75px;
    font-size:15px;
  }

  .controls{
    gap:7px;
  }

  .language{
    padding:10px 8px;
    font-size:13px;
  }

  .generate{
    padding:11px 13px;
    font-size:13px;
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:20;
  }

  .overlay.show{
    display:block;
  }

  .authCard{
    padding:25px 20px;
    border-radius:20px;
  }

  .authTitle{
    font-size:26px;
  }
}

/* =========================================================
   SCROLLBARS
========================================================= */

::-webkit-scrollbar{
  width:7px;
  height:7px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

::-webkit-scrollbar-thumb{
  background:#292c35;
  border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
  background:#3a3d48;
}
</style>
</head>

<body>

<!-- =======================================================
     AUTH SCREEN
======================================================= -->

<section
  class="authScreen"
  id="authScreen">

  <div class="authCard">

    <div class="authLogo">
      M
    </div>

    <h1 class="authTitle">
      Mercury AI
    </h1>

    <p class="authSubtitle">
      Tu generador de código con IA
    </p>

    <div class="authTabs">

      <button
        id="loginTab"
        class="authTab active"
        onclick="showAuth('login')">
        Iniciar sesión
      </button>

      <button
        id="registerTab"
        class="authTab"
        onclick="showAuth('register')">
        Crear cuenta
      </button>

    </div>

    <!-- LOGIN -->

    <form
      id="loginForm"
      class="authForm active"
      onsubmit="login(event)">

      <div class="field">

        <label>
          Email
        </label>

        <input
          id="loginEmail"
          type="email"
          autocomplete="email"
          placeholder="tu@email.com"
          required>

      </div>

      <div class="field">

        <label>
          Contraseña
        </label>

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          placeholder="Tu contraseña"
          required>

      </div>

      <button
        id="loginButton"
        class="authButton"
        type="submit">
        Iniciar sesión
      </button>

    </form>

    <!-- REGISTER -->

    <form
      id="registerForm"
      class="authForm"
      onsubmit="register(event)">

      <div class="field">

        <label>
          Email
        </label>

        <input
          id="registerEmail"
          type="email"
          autocomplete="email"
          placeholder="tu@email.com"
          required>

      </div>

      <div class="field">

        <label>
          Contraseña
        </label>

        <input
          id="registerPassword"
          type="password"
          autocomplete="new-password"
          minlength="6"
          placeholder="Mínimo 6 caracteres"
          required>

      </div>

      <button
        id="registerButton"
        class="authButton"
        type="submit">
        Crear cuenta
      </button>

    </form>

    <div
      id="authError"
      class="authError">
    </div>

  </div>

</section>


<!-- =======================================================
     MAIN APP
======================================================= -->

<div
  class="app"
  id="app">

  <!-- SIDEBAR -->

  <aside
    class="sidebar"
    id="sidebar">

    <div class="logo">

      <div class="logoIcon">
        M
      </div>

      <span>
        Mercury AI
      </span>

    </div>

    <button
      class="newChat"
      onclick="newChat()">
      ＋ Nuevo chat
    </button>

    <div class="historyTitle">
      Historial
    </div>

    <div
      class="chatList"
      id="chatList">
    </div>

    <div class="userBox">

      <div
        class="userEmail"
        id="userEmail">
        Cargando...
      </div>

      <div class="userActions">

        <button
          id="adminButton"
          class="adminButton"
          onclick="openAdmin()"
          style="display:none;">
          ⚙ Admin
        </button>

        <button
          class="logout"
          onclick="logout()">
          Salir
        </button>

      </div>

    </div>

  </aside>


  <!-- MOBILE OVERLAY -->

  <div
    class="overlay"
    id="overlay"
    onclick="closeSidebar()">
  </div>


  <!-- MAIN -->

  <main class="main">

    <!-- TOPBAR -->

    <header class="topbar">

      <button
        class="menuButton"
        onclick="openSidebar()">
        ☰
      </button>

      <div>

        <div class="topTitle">
          Generador
        </div>

        <div class="topSub">
          Mercury's AI Code Generator
        </div>

      </div>

    </header>


    <!-- CHAT -->

    <section
      class="chatArea"
      id="chatArea">

      <div
        class="messages"
        id="messages">

        <div
          class="welcome"
          id="welcome">

          <div class="welcomeLogo">
            M
          </div>

          <h1>
            ¿Qué quieres crear?
          </h1>

          <p>
            Describe lo que necesitas y Mercury AI
            generará el código para ti.
          </p>

        </div>

      </div>

    </section>


    <!-- COMPOSER -->

    <div class="composerWrap">

      <div class="composer">

        <textarea
          id="prompt"
          class="prompt"
          placeholder="Describe el código que quieres crear..."
          onkeydown="handleEnter(event)"
        ></textarea>

        <div class="controls">

          <select
            id="language"
            class="language">
          </select>

          <button
            id="generateBtn"
            class="generate"
            onclick="generateCode()">
            Generar
          </button>

        </div>

      </div>

      <div
        class="status"
        id="status">
      </div>

    </div>

  </main>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API = '';

let token =
  localStorage.getItem('mercury_token') || '';

let currentChatId = null;
let currentUser = null;


/* =========================================================
   ELEMENTS
========================================================= */

const authScreen =
  document.getElementById('authScreen');

const app =
  document.getElementById('app');

const loginTab =
  document.getElementById('loginTab');

const registerTab =
  document.getElementById('registerTab');

const loginForm =
  document.getElementById('loginForm');

const registerForm =
  document.getElementById('registerForm');

const authError =
  document.getElementById('authError');

const messagesEl =
  document.getElementById('messages');

const chatListEl =
  document.getElementById('chatList');

const statusEl =
  document.getElementById('status');

const promptEl =
  document.getElementById('prompt');

const languageEl =
  document.getElementById('language');

const generateBtn =
  document.getElementById('generateBtn');

const userEmailEl =
  document.getElementById('userEmail');

const sidebar =
  document.getElementById('sidebar');

const overlay =
  document.getElementById('overlay');

const adminButton =
  document.getElementById('adminButton');


/* =========================================================
   API
========================================================= */

async function api(
  url,
  options = {}
){

  const requestOptions = {
    ...options,
    headers:{
      ...(options.headers || {})
    }
  };

  if(
    requestOptions.body &&
    typeof requestOptions.body !== 'string'
  ){

    requestOptions.body =
      JSON.stringify(
        requestOptions.body
      );

    requestOptions.headers[
      'Content-Type'
    ] =
      'application/json';
  }

  if(
    !requestOptions.headers[
      'Content-Type'
    ] &&
    requestOptions.body
  ){

    requestOptions.headers[
      'Content-Type'
    ] =
      'application/json';
  }

  if(token){

    requestOptions.headers.Authorization =
      'Bearer ' + token;
  }

  const response =
    await f
