<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Mercury AI</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#08090d;
  color:#f5f5f7;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,
  "Segoe UI",sans-serif;
}

button,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

/* =========================================================
   APP
========================================================= */

.app{
  width:100%;
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  width:300px;
  min-width:300px;
  height:100%;
  background:#101116;
  border-right:1px solid #272933;
  display:flex;
  flex-direction:column;
  padding:18px;
  z-index:20;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:24px;
  font-weight:800;
  margin-bottom:20px;
}

.logoIcon{
  width:42px;
  height:42px;
  border-radius:13px;
  background:linear-gradient(
    135deg,
    #735cff,
    #9a7cff
  );
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.newChat{
  width:100%;
  border:0;
  border-radius:15px;
  padding:15px;
  background:#735cff;
  color:white;
  font-weight:800;
  font-size:16px;
  margin-bottom:20px;
  transition:.2s;
}

.newChat:hover{
  transform:translateY(-1px);
  filter:brightness(1.1);
}

.historyTitle{
  color:#858894;
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
  margin:5px 5px 10px;
}

.chatList{
  flex:1;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.chatItem{
  border:0;
  background:transparent;
  color:#dddde5;
  width:100%;
  text-align:left;
  padding:12px;
  border-radius:12px;
  display:flex;
  align-items:center;
  gap:10px;
  transition:.15s;
}

.chatItem:hover{
  background:#1c1e26;
}

.chatItem.active{
  background:#252431;
}

.chatIcon{
  font-size:17px;
  flex-shrink:0;
}

.chatTitle{
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:14px;
}

.deleteChat{
  opacity:0;
  border:0;
  background:transparent;
  color:#ff6b6b;
  padding:5px;
}

.chatItem:hover .deleteChat{
  opacity:1;
}

.userBox{
  border-top:1px solid #292b34;
  padding-top:15px;
  margin-top:12px;
}

.userEmail{
  color:#c8c8d0;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-bottom:10px;
}

.logout{
  width:100%;
  border:0;
  border-radius:12px;
  padding:11px;
  background:#202129;
  color:#ddd;
}

/* =========================================================
   MAIN
========================================================= */

.main{
  flex:1;
  height:100%;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(115,92,255,.12),
      transparent 40%
    ),
    #08090d;
}

/* =========================================================
   TOPBAR
========================================================= */

.topbar{
  height:72px;
  min-height:72px;
  border-bottom:1px solid #24262e;
  display:flex;
  align-items:center;
  padding:0 28px;
  gap:15px;
}

.menuButton{
  display:none;
  border:0;
  background:#1b1d24;
  color:white;
  border-radius:12px;
  width:44px;
  height:44px;
  font-size:22px;
}

.topTitle{
  font-size:18px;
  font-weight:800;
}

.topSub{
  color:#777a86;
  font-size:13px;
}

/* =========================================================
   CHAT
========================================================= */

.chatArea{
  flex:1;
  overflow-y:auto;
  padding:35px 25px;
}

.messages{
  width:100%;
  max-width:1050px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:25px;
}

.welcome{
  min-height:55vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:40px;
}

.welcomeLogo{
  width:82px;
  height:82px;
  border-radius:25px;
  background:linear-gradient(
    135deg,
    #735cff,
    #a383ff
  );
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  box-shadow:0 20px 70px rgba(115,92,255,.25);
  margin-bottom:25px;
}

.welcome h1{
  margin:0;
  font-size:42px;
  letter-spacing:-1px;
}

.welcome p{
  color:#858894;
  font-size:18px;
  margin-top:12px;
}

/* =========================================================
   MESSAGE
========================================================= */

.message{
  display:flex;
  gap:14px;
  width:100%;
}

.avatar{
  width:40px;
  height:40px;
  min-width:40px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.message.user .avatar{
  background:#272a33;
}

.message.assistant .avatar{
  background:linear-gradient(
    135deg,
    #735cff,
    #9a7cff
  );
}

.messageContent{
  min-width:0;
  flex:1;
}

.messageName{
  font-size:13px;
  color:#8e919c;
  margin-bottom:7px;
  font-weight:700;
}

.messageText{
  color:#eeeef2;
  font-size:16px;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word;
}

.codeBlock{
  margin-top:12px;
  background:#0b0c10;
  border:1px solid #292c36;
  border-radius:14px;
  overflow:hidden;
}

.codeHeader{
  height:42px;
  padding:0 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#15171d;
  color:#8f929e;
  font-size:12px;
}

.copyBtn{
  border:0;
  background:#242631;
  color:#ddd;
  border-radius:8px;
  padding:6px 10px;
  font-size:12px;
}

.codeBlock pre{
  margin:0;
  padding:17px;
  overflow-x:auto;
  color:#e9e9ee;
  font-size:13px;
  line-height:1.6;
  font-family:
    "SFMono-Regular",
    Consolas,
    "Liberation Mono",
    monospace;
}

/* =========================================================
   COMPOSER
========================================================= */

.composerWrap{
  padding:15px 25px 22px;
}

.composer{
  width:100%;
  max-width:1050px;
  margin:0 auto;
  background:#111219;
  border:1px solid #2a2c35;
  border-radius:22px;
  padding:14px;
  box-shadow:0 15px 60px rgba(0,0,0,.3);
}

.prompt{
  width:100%;
  min-height:90px;
  max-height:240px;
  resize:vertical;
  background:transparent;
  border:0;
  outline:0;
  color:white;
  padding:10px 12px;
  font-size:16px;
  line-height:1.5;
}

.prompt::placeholder{
  color:#666a75;
}

.controls{
  display:flex;
  gap:10px;
  align-items:center;
  margin-top:8px;
}

.language{
  flex:1;
  min-width:0;
  background:#1c1e26;
  border:1px solid #30323d;
  color:#eee;
  border-radius:12px;
  padding:11px 12px;
  outline:none;
}

.generate{
  border:0;
  background:#735cff;
  color:white;
  border-radius:12px;
  padding:12px 22px;
  font-weight:800;
  white-space:nowrap;
}

.generate:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.status{
  max-width:1050px;
  margin:8px auto 0;
  color:#ff7474;
  font-size:14px;
  min-height:20px;
}

/* =========================================================
   OVERLAY
========================================================= */

.overlay{
  display:none;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

  .sidebar{
    position:fixed;
    left:-310px;
    top:0;
    transition:.25s;
    box-shadow:20px 0 70px rgba(0,0,0,.5);
  }

  .sidebar.open{
    left:0;
  }

  .menuButton{
    display:block;
  }

  .topbar{
    padding:0 14px;
  }

  .topSub{
    display:none;
  }

  .chatArea{
    padding:20px 13px;
  }

  .messages{
    gap:20px;
  }

  .welcome{
    min-height:50vh;
    padding:25px;
  }

  .welcome h1{
    font-size:32px;
  }

  .welcome p{
    font-size:16px;
  }

  .message{
    gap:10px;
  }

  .avatar{
    width:34px;
    height:34px;
    min-width:34px;
    border-radius:10px;
  }

  .messageText{
    font-size:15px;
  }

  .composerWrap{
    padding:8px 10px 12px;
  }

  .composer{
    border-radius:18px;
    padding:10px;
  }

  .prompt{
    min-height:80px;
    font-size:15px;
  }

  .controls{
    flex-direction:row;
  }

  .language{
    min-width:0;
  }

  .generate{
    padding:11px 14px;
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:10;
  }

  .overlay.show{
    display:block;
  }
}

</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="logo">
      <div class="logoIcon">M</div>
      <span>Mercury AI</span>
    </div>

    <button
      class="newChat"
      onclick="newChat()">
      ＋ Nuevo chat
    </button>

    <div class="historyTitle">
      Historial
    </div>

    <div
      class="chatList"
      id="chatList">
    </div>

    <div class="userBox">

      <div
        class="userEmail"
        id="userEmail">
        Cargando...
      </div>

      <button
        class="logout"
        onclick="logout()">
        Cerrar sesión
      </button>

    </div>

  </aside>

  <div
    class="overlay"
    id="overlay"
    onclick="closeSidebar()">
  </div>

  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <button
        class="menuButton"
        onclick="openSidebar()">
        ☰
      </button>

      <div>
        <div class="topTitle">
          Generador
        </div>

        <div class="topSub">
          Mercury's AI Code Generator
        </div>
      </div>

    </header>

    <section
      class="chatArea"
      id="chatArea">

      <div
        class="messages"
        id="messages">

        <div
          class="welcome"
          id="welcome">

          <div class="welcomeLogo">
            M
          </div>

          <h1>
            ¿Qué quieres crear?
          </h1>

          <p>
            Describe tu script y Mercury AI lo generará.
          </p>

        </div>

      </div>

    </section>

    <!-- COMPOSER -->

    <div class="composerWrap">

      <div class="composer">

        <textarea
          id="prompt"
          class="prompt"
          placeholder="Describe el código que quieres crear..."
          onkeydown="handleEnter(event)"
        ></textarea>

        <div class="controls">

          <select
            id="language"
            class="language">
          </select>

          <button
            id="generateBtn"
            class="generate"
            onclick="generateCode()">
            Generar
          </button>

        </div>

      </div>

      <div
        class="status"
        id="status">
      </div>

    </div>

  </main>

</div>

<script>

const API = '';

let token =
  localStorage.getItem('mercury_token') || '';

let currentChatId = null;

const messagesEl =
  document.getElementById('messages');

const chatListEl =
  document.getElementById('chatList');

const statusEl =
  document.getElementById('status');

const promptEl =
  document.getElementById('prompt');

const languageEl =
  document.getElementById('language');

const generateBtn =
  document.getElementById('generateBtn');


// ==========================================================
// API
// ==========================================================

async function api(
  url,
  options = {}
){

  options.headers =
    options.headers || {};

  options.headers['Content-Type'] =
    'application/json';

  if(token){
    options.headers.Authorization =
      'Bearer ' + token;
  }

  const response =
    await fetch(
      API + url,
      options
    );

  let data;

  try{
    data =
      await response.json();
  }catch{
    data = {};
  }

  if(
    response.status === 401
  ){

    localStorage.removeItem(
      'mercury_token'
    );

    token = '';

    location.reload();
  }

  if(!response.ok){
    throw new Error(
      data.error ||
      'Error del servidor.'
    );
  }

  return data;
}


// ==========================================================
// INIT
// ==========================================================

async function init(){

  if(!token){

    location.href = '/';

    return;
  }

  try{

    const me =
      await api('/auth/me');

    document.getElementById(
      'userEmail'
    ).textContent =
      me.user.email;

    await loadLanguages();

    await loadChats();

  }catch(error){

    showError(
      error.message
    );
  }
}


// ==========================================================
// LANGUAGES
// ==========================================================

async function loadLanguages(){

  try{

    const data =
      await api('/languages');

    languageEl.innerHTML = '';

    data.languages.forEach(
      language => {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          language.name;

        option.textContent =
          language.info?.name ||
          language.name;

        languageEl.appendChild(
          option
        );

      }
    );

  }catch(error){

    languageEl.innerHTML = `
      <option value="javascript">
        JavaScript
      </option>
    `;

  }
}


// ==========================================================
// CHATS
// ==========================================================

async function loadChats(){

  const data =
    await api('/chats');

  chatListEl.innerHTML = '';

  if(!data.chats.length){

    chatListEl.innerHTML = `
      <div style="
        color:#666975;
        font-size:13px;
        padding:12px;
      ">
        Todavía no tienes chats.
      </div>
    `;

    return;
  }

  data.chats.forEach(
    chat => {

      const item =
        document.createElement(
          'div'
        );

      item.className =
        'chatItem' +
        (
          chat.id === currentChatId
            ? ' active'
            : ''
        );

      item.innerHTML = `
        <span class="chatIcon">
          💬
        </span>

        <span class="chatTitle">
          ${escapeHtml(chat.title)}
        </span>

        <button
          class="deleteChat"
          onclick="
            event.stopPropagation();
            deleteChat(${chat.id});
          ">
          🗑️
        </button>
      `;

      item.onclick = () =>
        openChat(chat.id);

      chatListEl.appendChild(
        item
      );

    }
  );
}


// ==========================================================
// OPEN CHAT
// ==========================================================

async function openChat(id){

  try{

    const data =
      await api(
        '/chats/' + id
      );

    currentChatId = id;

    messagesEl.innerHTML = '';

    data.messages.forEach(
      message => {

        addMessage(
          message.role,
          message.content,
          message.language
        );

      }
    );

    if(!data.messages.length){
      showWelcome();
    }

    await loadChats();

    closeSidebar();

    scrollBottom();

  }catch(error){

    showError(
      error.message
    );
  }
}


// ==========================================================
// NEW CHAT
// ==========================================================

async function newChat(){

  try{

    const data =
      await api(
        '/chats',
        {
          method:'POST',

          body:JSON.stringify({
            title:'Nuevo chat'
          })
        }
      );

    currentChatId =
      data.chat.id;

    messagesEl.innerHTML = '';

    showWelcome();

    promptEl.value = '';

    await loadChats();

    closeSidebar();

    promptEl.focus();

  }catch(error){

    showError(
      error.message
    );
  }
}


// ==========================================================
// DELETE CHAT
// ==========================================================

async function deleteChat(id){

  if(
    !confirm(
      '¿Borrar este chat?'
    )
  ){
    return;
  }

  try{

    await api(
      '/chats/' + id,
      {
        method:'DELETE'
      }
    );

    if(
      currentChatId === id
    ){

      currentChatId = null;

      messagesEl.innerHTML = '';

      showWelcome();
    }

    await loadChats();

  }catch(error){

    showError(
      error.message
    );
  }
}


// ==========================================================
// GENERATE
// ==========================================================

async function generateCode(){

  const prompt =
    promptEl.value.trim();

  if(!prompt){

    showError(
      'Escribe qué quieres crear.'
    );

    promptEl.focus();

    return;
  }

  generateBtn.disabled = true;

  statusEl.textContent =
    'Mercury está generando...';

  addMessage(
    'user',
    prompt
  );

  promptEl.value = '';

  try{

    const data =
      await api(
        '/generate',
        {
          method:'POST',

          body:JSON.stringify({
            prompt,
            language:
              languageEl.value,
            chatId:
              currentChatId
          })
        }
      );

    currentChatId =
      data.chatId;

    addMessage(
      'assistant',
      data.code,
      data.language
    );

    statusEl.textContent = '';

    await loadChats();

    scrollBottom();

  }catch(error){

    statusEl.textContent = '';

    showError(
      error.message
    );

  }finally{

    generateBtn.disabled = false;

  }
}


// ==========================================================
// MESSAGE
// ==========================================================

function addMessage(
  role,
  content,
  language
){

  const welcome =
    document.getElementById(
      'welcome'
    );

  if(welcome){
    welcome.remove();
  }

  const wrapper =
    document.createElement(
      'div'
    );

  wrapper.className =
    'message ' +
    (
      role === 'user'
        ? 'user'
        : 'assistant'
    );

  const avatar =
    role === 'user'
      ? 'U'
      : 'M';

  const name =
    role === 'user'
      ? 'Tú'
      : 'Mercury AI';

  if(
    role === 'assistant'
  ){

    wrapper.innerHTML = `
      <div class="avatar">
        ${avatar}
      </div>

      <div class="messageContent">

        <div class="messageName">
          ${name}
        </div>

        <div class="codeBlock">

          <div class="codeHeader">

            <span>
              ${escapeHtml(
                language ||
                'code'
              )}
            </span>

            <button
              class="copyBtn"
              onclick="copyCode(this)">
              Copiar
            </button>

          </div>

          <pre><code>${escapeHtml(
            content
          )}</code></pre>

        </div>

      </div>
    `;

  }else{

    wrapper.innerHTML = `
      <div class="avatar">
        ${avatar}
      </div>

      <div class="messageContent">

        <div class="messageName">
          ${name}
        </div>

        <div class="messageText">
          ${escapeHtml(content)}
        </div>

      </div>
    `;
  }

  messagesEl.appendChild(
    wrapper
  );

  scrollBottom();
}


// ==========================================================
// COPY
// ==========================================================

async function copyCode(button){

  const code =
    button
      .closest('.codeBlock')
      .querySelector('code')
      .textContent;

  try{

    await navigator.clipboard.writeText(
      code
    );

    const old =
      button.textContent;

    button.textContent =
      'Copiado ✓';

    setTimeout(
      () => {
        button.textContent =
          old;
      },
      1500
    );

  }catch{

    showError(
      'No se pudo copiar el código.'
    );
  }
}


// ==========================================================
// ENTER
// ==========================================================

function handleEnter(event){

  if(
    event.key === 'Enter' &&
    !event.shiftKey
  ){

    event.preventDefault(
