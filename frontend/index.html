<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Mercury's AI-Generator</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: #09090d;
  color: #fff;
  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}


/* =========================================
   LOGIN
========================================= */

#authScreen {
  width: 100%;
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;
}

.authBox {
  width: 100%;
  max-width: 430px;

  padding: 30px;

  background: #15151d;

  border:
    1px solid #2c2c38;

  border-radius: 22px;

  box-shadow:
    0 20px 70px
    rgba(0, 0, 0, .45);
}

.logo {
  text-align: center;

  font-size: 30px;
  font-weight: 800;

  margin-bottom: 8px;
}

.subtitle {
  text-align: center;

  color: #9696a6;

  margin-bottom: 25px;
}

.authBox input {
  width: 100%;

  padding: 15px;

  margin-bottom: 12px;

  border:
    1px solid #353541;

  border-radius: 12px;

  background: #0d0d13;

  color: #fff;

  outline: none;
}

.authBox input:focus {
  border-color: #6d5dfc;
}

.primaryButton,
.secondaryButton {
  width: 100%;

  border: 0;

  border-radius: 12px;

  padding: 14px;

  font-weight: 700;
}

.primaryButton {
  background: #6d5dfc;
  color: #fff;
}

.secondaryButton {
  margin-top: 10px;

  background: #292936;
  color: #fff;
}

.authMessage {
  margin-top: 15px;

  padding: 12px;

  border-radius: 10px;

  background: #0d0d13;

  color: #ccc;

  text-align: center;
}


/* =========================================
   APP
========================================= */

#app {
  width: 100%;
  height: 100vh;

  display: flex;

  overflow: hidden;
}


/* =========================================
   SIDEBAR
========================================= */

.sidebar {
  width: 280px;
  min-width: 280px;
  height: 100%;

  display: flex;
  flex-direction: column;

  background: #111118;

  border-right:
    1px solid #292936;
}

.sidebarTop {
  padding: 15px;

  border-bottom:
    1px solid #292936;
}

.brand {
  font-size: 20px;
  font-weight: 800;

  margin-bottom: 14px;
}

.newChat {
  width: 100%;

  padding: 12px;

  border:
    1px solid #3a3a48;

  border-radius: 10px;

  background: #1c1c25;

  color: #fff;
}

.history {
  flex: 1;

  overflow-y: auto;

  padding: 10px;
}

.chatItem {
  display: flex;

  gap: 4px;

  margin-bottom: 5px;
}

.chatOpen {
  flex: 1;

  min-width: 0;

  padding: 11px;

  border: 0;

  border-radius: 9px;

  background: transparent;

  color: #c7c7d2;

  text-align: left;

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;
}

.chatOpen:hover {
  background: #20202a;

  color: #fff;
}

.chatDelete {
  padding: 7px;

  border: 0;

  background: transparent;

  color: #777;
}

.chatDelete:hover {
  color: #ff6666;
}

.sidebarBottom {
  padding: 13px;

  border-top:
    1px solid #292936;
}

.userEmail {
  font-size: 12px;

  color: #9999aa;

  margin-bottom: 10px;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
}

.logout {
  width: 100%;

  padding: 10px;

  border: 0;

  border-radius: 9px;

  background: #292936;

  color: #fff;
}


/* =========================================
   MAIN
========================================= */

.main {
  flex: 1;

  min-width: 0;

  height: 100%;

  display: flex;
  flex-direction: column;
}

.topbar {
  height: 58px;
  min-height: 58px;

  display: flex;

  align-items: center;

  gap: 10px;

  padding: 10px 15px;

  background: #111118;

  border-bottom:
    1px solid #292936;
}

.menu {
  display: none;

  border: 0;

  background: transparent;

  color: #fff;

  font-size: 23px;
}

.chatTitle {
  font-weight: 700;

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;
}


/* =========================================
   MESSAGES
========================================= */

.messages {
  flex: 1;

  overflow-y: auto;

  padding: 25px 15px;
}

.welcome {
  width: 100%;
  height: 100%;

  display: flex;

  align-items: center;

  justify-content: center;

  text-align: center;

  color: #888899;
}

.welcome h2 {
  color: #fff;
}

.messageRow {
  width: 100%;

  max-width: 900px;

  margin: 0 auto 20px;

  display: flex;
}

.messageRow.user {
  justify-content: flex-end;
}

.bubble {
  max-width: 85%;

  padding: 14px 16px;

  border-radius: 15px;

  line-height: 1.5;

  white-space: pre-wrap;

  word-break: break-word;
}

.messageRow.user .bubble {
  background: #5d50dc;
}

.messageRow.assistant .bubble {
  background: #181821;

  border:
    1px solid #2d2d39;
}

.codeTitle {
  color: #aaa;

  font-size: 12px;

  margin-bottom: 8px;
}

.code {
  margin: 0;

  padding: 14px;

  overflow-x: auto;

  background: #09090d;

  border:
    1px solid #30303c;

  border-radius: 10px;

  font-family: monospace;

  font-size: 13px;

  white-space: pre;
}

.codeButtons {
  display: flex;

  gap: 8px;

  margin-top: 9px;
}

.smallButton {
  padding: 8px 10px;

  border: 0;

  border-radius: 8px;

  background: #292936;

  color: #fff;

  font-size: 12px;
}


/* =========================================
   COMPOSER
========================================= */

.composer {
  padding:
    10px 15px 18px;

  background: #111118;

  border-top:
    1px solid #292936;
}

.composerInner {
  width: 100%;

  max-width: 900px;

  margin: auto;
}

.controls {
  display: flex;

  gap: 8px;

  margin-bottom: 8px;
}

.controls select {
  padding: 8px;

  border:
    1px solid #30303d;

  border-radius: 8px;

  background: #1b1b24;

  color: #fff;
}

.promptRow {
  display: flex;

  gap: 9px;
}

#prompt {
  flex: 1;

  min-height: 52px;

  max-height: 180px;

  resize: none;

  padding: 14px;

  border:
    1px solid #30303d;

  border-radius: 12px;

  background: #0d0d13;

  color: #fff;

  outline: none;
}

#prompt:focus {
  border-color: #6d5dfc;
}

.send {
  width: 55px;

  min-width: 55px;

  border: 0;

  border-radius: 12px;

  background: #6d5dfc;

  color: #fff;

  font-size: 20px;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

  .sidebar {
    position: fixed;

    z-index: 100;

    left: -290px;

    top: 0;
    bottom: 0;

    transition:
      left .2s ease;
  }

  .sidebar.open {
    left: 0;
  }

  .menu {
    display: block;
  }

  .messages {
    padding:
      15px 10px;
  }

  .bubble {
    max-width: 92%;
  }

  .composer {
    padding: 8px;
  }

  .topbar {
    height: 54px;
    min-height: 54px;
  }

  .authBox {
    padding: 24px;
  }

}

</style>

</head>

<body>


<!-- =========================================
     AUTH SCREEN
========================================= -->

<div id="authScreen">

  <div class="authBox">

    <div class="logo">
      Mercury's AI-Generator
    </div>

    <div class="subtitle">
      Tu asistente especializado en programación
    </div>

    <input
      id="email"
      type="email"
      placeholder="Correo electrónico"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Contraseña"
      autocomplete="current-password"
    >

    <button
      class="primaryButton"
      onclick="registerUser()"
    >
      Crear cuenta
    </button>

    <button
      class="secondaryButton"
      onclick="loginUser()"
    >
      Iniciar sesión
    </button>

    <div
      id="authMessage"
      class="authMessage hidden"
    ></div>

  </div>

</div>


<!-- =========================================
     APP
========================================= -->

<div
  id="app"
  class="hidden"
>

  <aside
    id="sidebar"
    class="sidebar"
  >

    <div class="sidebarTop">

      <div class="brand">
        Mercury ⚡
      </div>

      <button
        class="newChat"
        onclick="newChat()"
      >
        ＋ Nueva conversación
      </button>

    </div>

    <div
      id="history"
      class="history"
    ></div>

    <div class="sidebarBottom">

      <div
        id="userEmail"
        class="userEmail"
      ></div>

      <button
        class="logout"
        onclick="logout()"
      >
        Cerrar sesión
      </button>

    </div>

  </aside>


  <main class="main">

    <header class="topbar">

      <button
        class="menu"
        onclick="toggleSidebar()"
      >
        ☰
      </button>

      <div
        id="chatTitle"
        class="chatTitle"
      >
        Nueva conversación
      </div>

    </header>


    <section
      id="messages"
      class="messages"
    >

      <div class="welcome">

        <div>

          <h2>
            ¿Qué quieres programar?
          </h2>

          <p>
            Pídeme crear, explicar,
            corregir o mejorar código.
          </p>

        </div>

      </div>

    </section>


    <div class="composer">

      <div class="composerInner">

        <div class="controls">

          <select id="language">

            <option value="javascript">
              JavaScript
            </option>

            <option value="python">
              Python
            </option>

            <option value="bash">
              Bash
            </option>

            <option value="c">
              C
            </option>

            <option value="cpp">
              C++
            </option>

            <option value="java">
              Java
            </option>

            <option value="go">
              Go
            </option>

            <option value="rust">
              Rust
            </option>

            <option value="php">
              PHP
            </option>

            <option value="ruby">
              Ruby
            </option>

            <option value="powershell">
              PowerShell
            </option>

            <option value="sql">
              SQL
            </option>

          </select>

        </div>


        <div class="promptRow">

          <textarea
            id="prompt"
            placeholder="Escribe lo que quieres programar..."
          ></textarea>

          <button
            class="send"
            onclick="sendMessage()"
          >
            ➤
          </button>

        </div>

      </div>

    </div>

  </main>

</div>


<script>

let token =
  localStorage.getItem(
    'mercury_token'
  );

let currentConversation = null;


// ============================================
// API
// ============================================

async function api(
  url,
  options = {}
) {

  const headers = {
    'Content-Type': 'application/json',
    ...(options.headers || {})
  };

  if (token) {

    headers.Authorization =
      'Bearer ' + token;

  }

  return fetch(
    url,
    {
      ...options,
      headers
    }
  );

}


// ============================================
// AUTH MESSAGE
// ============================================

function showAuthMessage(
  text
) {

  const box =
    document.getElementById(
      'authMessage'
    );

  box.textContent = text;

  box.classList.remove(
    'hidden'
  );

}


// ============================================
// REGISTER
// ============================================

async function registerUser() {

  const email =
    document
      .getElementById('email')
      .value
      .trim();

  const password =
    document
      .getElementById('password')
      .value;

  if (!email || !password) {

    showAuthMessage(
      'Introduce correo y contraseña.'
    );

    return;

  }

  try {

    const response =
      await api(
        '/api/register',
        {
          method: 'POST',

          body:
            JSON.stringify({
              email,
              password
            })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      showAuthMessage(
        '❌ ' +
        (
          data.error ||
          'No se pudo crear la cuenta.'
        )
      );

      return;

    }

    token =
      data.token;

    localStorage.setItem(
      'mercury_token',
      token
    );

    await startApp();

  } catch (error) {

    console.error(error);

    showAuthMessage(
      '❌ Error de conexión.'
    );

  }

}


// ============================================
// LOGIN
// ============================================

async function loginUser() {

  const email =
    document
      .getElementById('email')
      .value
      .trim();

  const password =
    document
      .getElementById('password')
      .value;

  if (!email || !password) {

    showAuthMessage(
      'Introduce correo y contraseña.'
    );

    return;

  }

  try {

    const response =
      await api(
        '/api/login',
        {
          method: 'POST',

          body:
            JSON.stringify({
              email,
              password
            })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      showAuthMessage(
        '❌ ' +
        (
          data.error ||
          'No se pudo iniciar sesión.'
        )
      );

      return;

    }

    token =
      data.token;

    localStorage.setItem(
      'mercury_token',
      token
    );

    await startApp();

  } catch (error) {

    console.error(error);

    showAuthMessage(
      '❌ Error de conexión.'
    );

  }

}


// ============================================
// START APP
// ============================================

async function startApp() {

  const response =
    await api('/api/me');

  if (!response.ok) {

    logout();

    return;

  }

  const data =
    await response.json();

  document
    .getElementById('authScreen')
    .classList.add('hidden');

  document
    .getElementById('app')
    .classList.remove('hidden');

  document
    .getElementById('userEmail')
    .textContent =
      data.user.email;

  await loadConversations();

}


// ============================================
// LOAD HISTORY
// ============================================

async function loadConversations() {

  const response =
    await api(
      '/api/conversations'
    );

  if (!response.ok) {
    return;
  }

  const data =
    await response.json();

  const history =
    document.getElementById(
      'history'
    );

  history.innerHTML = '';

  data.conversations.forEach(
    function(conversation) {

      const row =
        document.createElement(
          'div'
        );

      row.className =
        'chatItem';


      const open =
        document.createElement(
          'button'
        );

      open.className =
        'chatOpen';

      open.textContent =
        conversation.title;

      open.onclick =
        function() {

          openConversation(
            conversation.id
          );

        };


      const del =
        document.createElement(
          'button'
        );

      del.className =
        'chatDelete';

      del.textContent =
        '🗑️';

      del.onclick =
        function(event) {

          event.stopPropagation();

          deleteConversation(
            conversation.id
          );

        };


      row.appendChild(open);

      row.appendChild(del);

      history.appendChild(row);

    }
  );

}


// ============================================
// NEW CHAT
// ============================================

function newChat() {

  currentConversation =
    null;

  document
    .getElementById('chatTitle')
    .textContent =
      'Nueva conversación';

  document
    .getElementById('messages')
    .innerHTML =

    '<div class="welcome">' +

      '<div>' +

        '<h2>' +
          '¿Qué quieres programar?' +
        '</h2>' +

        '<p>' +
          'Pídeme crear, explicar, ' +
          'corregir o mejorar código.' +
        '</p>' +

      '</div>' +

    '</div>';

  closeSidebar();

}


// ============================================
// OPEN CHAT
// ============================================

async function openConversation(
  id
) {

  const response =
    await api(
      '/api/conversations/' +
      id
    );

  if (!response.ok) {
    return;
  }

  const data =
    await response.json();

  currentConversation =
    data.conversation;

  document
    .getElementById('chatTitle')
    .textContent =
      data.conversation.title;

  renderMessages(
    data.messages
  );

  closeSidebar();

}


// ============================================
// RENDER MESSAGES
// ============================================

function renderMessages(
  messages
) {

  const container =
    document.getElementById(
      'messages'
    );

  container.innerHTML = '';

  messages.forEach(
    function(message) {

      addMessage(
        message.role,
        message.content,
        message.language
      );

    }
  );

  scrollMessages();

}


// ============================================
// ADD MESSAGE
// ============================================

function addMessage(
  role,
  content,
  language
) {

  const container =
    document.getElementById(
      'messages'
    );

  const row =
    document.createElement(
      'div'
    );

  row.className =
    'messageRow ' +
    (
      role === 'user'
        ? 'user'
        : 'assistant'
    );


  const bubble =
    document.createElement(
      'div'
    );

  bubble.className =
    'bubble';


  if (
    role === 'assistant' &&
    language
  ) {

    const title =
      document.createElement(
        'div'
      );

    title.className =
      'codeTitle';

    title.textContent =
      'Código generado · ' +
      language;

    bubble.appendChild(title);


    const code =
      document.createElement(
        'pre'
      );

    code.className =
      'code';

    code.textContent =
      content;

    bubble.appendChild(code);


    const buttons =
      document.createElement(
        'div'
      );

    buttons.className =
      'codeButtons';


    const copy =
      document.createElement(
        'button'
      );

    copy.className =
      'smallButton';

    copy.textContent =
      '📋 Copiar';

    copy.onclick =
      async function() {

        await navigator
          .clipboard
          .writeText(content);

        copy.textContent =
          '✅ Copiado';

        setTimeout(
          function() {

            copy.textContent =
              '📋 Copiar';

          },
          1500
        );

      };


    const download =
      document.createElement(
        'button'
      );

    download.className =
      'smallButton';

    download.textContent =
      '📥 Descargar';

    download.onclick =
      function() {

        downloadCode(
          content,
          language
        );

      };


    buttons.appendChild(copy);

    buttons.appendChild(download);

    bubble.appendChild(buttons);

  } else {

    bubble.textContent =
      content;

  }


  row.appendChild(bubble);

  container.appendChild(row);

}


// ============================================
// SEND
// ============================================

async function sendMessage() {

  const input =
    document.getElementById(
      'prompt'
    );

  const prompt =
    input.value.trim();

  if (!prompt) {
    return;
  }

  input.value = '';

  addMessage(
    'user',
    prompt
  );

  scrollMessages();


  const language =
    document.getElementById(
      'language'
    ).value;


  try {

    const response =
      await api(
        '/api/chat',
        {
          method: 'POST',

          body:
            JSON.stringify({

              prompt,

              language,

              conversationId:
                currentConversation
                  ? currentConversation.id
                  : null

            })

        }
      );


    const data =
      await respon
